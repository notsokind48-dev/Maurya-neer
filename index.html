<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b4c"><meta name="description" content="Maurya Jal water plant customer, jar, payment and subscription manager."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Maurya Jal • Plant Manager</title>
<style>
:root{--navy:#073b4c;--teal:#087e8b;--mint:#d8f3ee;--paper:#f5f8f7;--ink:#142c35;--muted:#637780;--line:#dce7e5;--white:#fff;--gold:#f2b84b;--red:#b93838;--green:#18794e;--shadow:0 8px 24px #073b4c0d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100dvh;padding-bottom:88px}.top{background:linear-gradient(135deg,#073b4c,#087e8b);color:white;padding:22px 18px 26px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:#ffffff20;display:grid;place-items:center;font-size:25px;border:1px solid #ffffff35}.brand h1{font-size:20px;margin:0;letter-spacing:.2px}.brand p{margin:2px 0 0;color:#c8e8e7;font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.today{margin-top:22px;color:#d5eeec;font-size:13px}.hero{font-size:24px;font-weight:750;margin-top:3px;letter-spacing:-.5px}.hero small{font-size:14px;font-weight:500;color:#d5eeec}.main{padding:18px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}.pagehead h2{margin:0;font-size:22px;letter-spacing:-.4px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--teal);color:white;font-weight:700;box-shadow:0 3px 9px #087e8b22}.btn.secondary{background:#e4f2f0;color:var(--navy);box-shadow:none}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#fff0f0;color:var(--red);box-shadow:none}.btn.small{padding:8px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{padding:16px;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.statlabel{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.statvalue{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:-.5px}.statfoot{font-size:11px;color:var(--muted);margin-top:4px}.ico{width:29px;height:29px;border-radius:10px;background:var(--mint);display:grid;place-items:center}.section{margin-top:22px}.sectiontitle{font-size:16px;font-weight:750;margin-bottom:10px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 12px;border:1px solid var(--line);border-radius:15px;background:white;color:var(--ink);font-weight:700}.quick .qico{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--mint);font-size:18px}.listrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #edf2f1}.listrow:last-child{border-bottom:0}.avatar{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:#e3f4f1;color:var(--navy);font-weight:800}.grow{flex:1;min-width:0}.name{font-weight:750;overflow:hidden;text-overflow:ellipsis}.muted{font-size:12px;color:var(--muted)}.money{font-weight:800;white-space:nowrap}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:750;background:#e7f6ee;color:var(--green)}.pill.warn{background:#fff4d9;color:#8c5a00}.pill.red{background:#fff0f0;color:var(--red)}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));}.tabsinner{display:grid;grid-template-columns:repeat(5,1fr);width:min(650px,100%);gap:3px}.tab{border:0;background:transparent;color:#6b7f85;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:12px;font-size:10px;font-weight:650}.tab span:first-child{font-size:20px}.tab.active{color:var(--teal);background:#e6f5f2}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d5e2df;border-radius:12px;padding:12px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087e8b18}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.empty .big{font-size:32px;margin-bottom:8px}.search{margin-bottom:12px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.balance{font-size:13px;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.balance b{color:var(--red)}.balance .ok{color:var(--green)}.bar{height:8px;background:#eaf0ef;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{height:100%;display:block;background:var(--teal);border-radius:99px}.note{background:#fff8e7;border:1px solid #f5e2ad;border-radius:14px;padding:12px;font-size:12px;color:#75551c}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:700}.hidden{display:none!important}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#143942;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:90%;font-size:13px}.customerhead{display:flex;align-items:center;gap:10px}.customeractions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.divider{height:1px;background:var(--line);margin:13px 0}.inlinefield{display:flex;gap:8px}.inlinefield>*{min-width:0}.footnote{font-size:11px;color:var(--muted);text-align:center;margin:20px 0 5px}
@media(min-width:720px){.main{padding:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,1fr)}.top{padding:25px 28px}.formgrid{grid-template-columns:1fr 1fr}.app{padding-bottom:35px}.tabs{position:sticky;bottom:0;border:1px solid var(--line);border-radius:18px;margin:0 auto 18px;width:calc(100% - 36px)}.toast{bottom:25px}}
</style></head>
<body><div class="app">
<header class="top"><div class="topline"><div class="brand"><div class="logo">💧</div><div><h1 id="brandName">Maurya Jal</h1><p>WATER PLANT • BUSINESS MANAGER</p></div></div><button class="btn small" style="background:#ffffff20;border:1px solid #ffffff40;box-shadow:none" onclick="showPage('settings')">⚙ Settings</button></div><div class="today" id="today"></div><div class="hero">Every jar. Every rupee.<br><small>Your business, organised.</small></div></header>
<main class="main">
<section id="page-dashboard"></section><section id="page-customers" class="hidden"></section><section id="page-ledger" class="hidden"></section><section id="page-plans" class="hidden"></section><section id="page-settings" class="hidden"></section>
</main>
<nav class="tabs"><div class="tabsinner">
<button class="tab active" data-page="dashboard" onclick="showPage('dashboard')"><span>⌂</span><span>Home</span></button>
<button class="tab" data-page="customers" onclick="showPage('customers')"><span>♙</span><span>Customers</span></button>
<button class="tab" data-page="ledger" onclick="showPage('ledger')"><span>⇄</span><span>Transactions</span></button>
<button class="tab" data-page="plans" onclick="showPage('plans')"><span>▦</span><span>Subscriptions</span></button>
<button class="tab" data-page="settings" onclick="showPage('settings')"><span>☷</span><span>Backup</span></button>
</div></nav></div><div id="toast" class="toast hidden"></div>
<dialog id="modal" style="border:0;border-radius:20px;width:min(560px,calc(100% - 24px));padding:0;box-shadow:0 24px 90px #062f3c40;max-height:90dvh;overflow:auto"><div id="modalContent" style="padding:20px"></div></dialog>
<script>
const KEY='mauryaJalManagerV1';
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const nowISO=()=>new Date().toISOString();
let db={settings:{brand:'Maurya Jal',jarPrice:20,defaultDeposit:100,openingJars:0},customers:[],transactions:[],plans:[]};
let currentPage='dashboard', searchText='';
try{const saved=localStorage.getItem(KEY);if(saved)db={...db,...JSON.parse(saved)};}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll();}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cash(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function dateFmt(d){if(!d)return '—';let x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500);}
function customer(idv){return db.customers.find(c=>c.id===idv);}
function txFor(cid){return db.transactions.filter(t=>t.customerId===cid);}
function metrics(cid){let ts=txFor(cid);let due=0,deposit=0,jars=0,water=0,paid=0;ts.forEach(t=>{if(t.type==='delivery'){jars+=Number(t.jars||0);water+=Number(t.amount||0);due+=Number(t.amount||0);}if(t.type==='return'){jars-=Number(t.jars||0);}if(t.type==='payment'){due-=Number(t.amount||0);paid+=Number(t.amount||0);}if(t.type==='deposit_in')deposit+=Number(t.amount||0);if(t.type==='deposit_out')deposit-=Number(t.amount||0);});return {due:Math.max(0,due),credit:Math.max(0,-due),deposit,jars,water,paid};}
function totalMetrics(){let m={due:0,deposit:0,jarsOut:0,customers:db.customers.filter(c=>c.active!==false).length,deliveredToday:0,receivedToday:0};db.customers.forEach(c=>{let x=metrics(c.id);m.due+=x.due;m.deposit+=x.deposit;m.jarsOut+=Math.max(0,x.jars);});db.transactions.forEach(t=>{if(t.date===todayISO()&&t.type==='delivery')m.deliveredToday+=Number(t.jars||0);if(t.date===todayISO()&&['payment','deposit_in'].includes(t.type))m.receivedToday+=Number(t.amount||0);});return m;}
function showPage(p){currentPage=p;document.querySelectorAll('[id^="page-"]').forEach(e=>e.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.page===p));renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function pageHead(title,sub,button=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${button}</div>`}
function renderAll(){document.getElementById('brandName').textContent=db.settings.brand||'Maurya Jal';document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderDashboard();renderCustomers();renderLedger();renderPlans();renderSettings();}
function renderDashboard(){let m=totalMetrics();let recent=[...db.transactions].sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,5);document.getElementById('page-dashboard').innerHTML=`
${pageHead('Business overview','A quick look at your water plant','<button class="btn small" onclick="openTx()">＋ Entry</button>')}
<div class="grid">
<div class="stats"><div class="statlabel"><span class="ico">₹</span> Outstanding</div><div class="statvalue">${cash(m.due)}</div><div class="statfoot">Water charges due</div></div>
<div class="stats"><div class="statlabel"><span class="ico">♙</span> Customers</div><div class="statvalue">${m.customers}</div><div class="statfoot">Active customer records</div></div>
<div class="stats"><div class="statlabel"><span class="ico">🫙</span> Jars outside</div><div class="statvalue">${m.jarsOut}</div><div class="statfoot">Based on recorded deliveries/returns</div></div>
<div class="stats"><div class="statlabel"><span class="ico">↗</span> Received today</div><div class="statvalue">${cash(m.receivedToday)}</div><div class="statfoot">${m.deliveredToday} jars delivered today</div></div>
</div>
<div class="section"><div class="sectiontitle">Quick actions</div><div class="quick">
<button onclick="openCustomer()"><span class="qico">＋</span><span>Add customer</span></button>
<button onclick="openTx('delivery')"><span class="qico">🫙</span><span>Deliver water</span></button>
<button onclick="openTx('payment')"><span class="qico">₹</span><span>Record payment</span></button>
<button onclick="openTx('return')"><span class="qico">↩</span><span>Jar return</span></button>
</div></div>
<div class="section"><div class="sectiontitle">Customers to follow up</div><div class="card">${db.customers.filter(c=>metrics(c.id).due>0).sort((a,b)=>metrics(b.id).due-metrics(a.id).due).slice(0,4).map(c=>`<div class="listrow"><div class="avatar">${esc((c.name||'?').trim().charAt(0).toUpperCase())}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${metrics(c.id).jars} jar(s) out</div></div><div class="money" style="color:var(--red)">${cash(metrics(c.id).due)}</div><button class="btn secondary small" onclick="openTx('payment','${c.id}')">Pay</button></div>`).join('')||'<div class="empty"><div class="big">✓</div>No pending water charges recorded.</div>'}</div></div>
<div class="section"><div class="sectiontitle">Recent activity</div><div class="card">${recent.map(txRow).join('')||'<div class="empty"><div class="big">🧾</div>Your dated entries will appear here.</div>'}</div></div>
<div class="footnote">Your records are saved on this device. Export a backup regularly in Settings.</div>`;}
function txLabel(t){return ({delivery:'Water delivered',return:'Empty jars returned',payment:'Payment received',deposit_in:'Security deposit received',deposit_out:'Security deposit refunded',adjustment:'Balance adjustment'})[t.type]||t.type;}
function txRow(t){let c=customer(t.customerId),negative=['deposit_out'].includes(t.type);let detail=t.type==='delivery'?`${t.jars} × 20-litre jar${t.jars==1?'':'s'} · charge ${cash(t.amount)}`:t.type==='return'?`${t.jars} empty jar(s) returned`:t.type==='payment'?`${t.method||'Payment'} · ${t.note?esc(t.note):'Water bill'}`:t.note?esc(t.note):'Security / account entry';return `<div class="listrow"><div class="avatar">${t.type==='delivery'?'🫙':t.type==='payment'?'₹':t.type==='return'?'↩':'▣'}</div><div class="grow"><div class="name">${esc(c?.name||'Deleted customer')} · ${esc(txLabel(t))}</div><div class="muted">${dateFmt(t.date)} · ${detail}</div></div><div class="money">${t.type==='return'?'':(negative?'−':'')+cash(t.amount)}</div></div>`}
function renderCustomers(){let q=(document.getElementById('customerSearch')?.value||'').toLowerCase();let list=db.customers.filter(c=>(c.name+' '+(c.phone||'')+' '+(c.address||'')).toLowerCase().includes(q));document.getElementById('page-customers').innerHTML=`
${pageHead('Customers','Customer profiles, jars and balances','<button class="btn small" onclick="openCustomer()">＋ Add</button>')}
<input class="search" id="customerSearch" placeholder="Search name, phone or address…" value="${esc(q)}" oninput="renderCustomersKeepFocus(this.value)">
${list.map(c=>{let m=metrics(c.id);return `<div class="card"><div class="customerhead"><div class="avatar">${esc((c.name||'?').trim().charAt(0).toUpperCase())}</div><div class="grow"><div class="name">${esc(c.name)} ${c.active===false?'<span class="pill red">Inactive</span>':''}</div><div class="muted">${esc(c.phone||'No phone')} ${c.address?'· '+esc(c.address):''}</div></div><button class="btn ghost small" onclick="openCustomer('${c.id}')">Edit</button></div><div class="balance"><span>Jars with customer: <strong>${m.jars}</strong></span><span>Deposit held: <strong>${cash(m.deposit)}</strong></span><span>Due: <b>${cash(m.due)}</b></span></div><div class="customeractions"><button class="btn small" onclick="openTx('delivery','${c.id}')">＋ Deliver</button><button class="btn secondary small" onclick="openTx('payment','${c.id}')">₹ Payment</button><button class="btn ghost small" onclick="customerDetails('${c.id}')">History</button><button class="btn ghost small" onclick="openTx('return','${c.id}')">Return jar</button></div></div>`}).join('')||'<div class="card empty"><div class="big">♙</div>No customers yet.<br>Add your first customer to begin.</div>'}`;}
function renderCustomersKeepFocus(v){renderCustomers();let e=document.getElementById('customerSearch');e.focus();e.setSelectionRange(v.length,v.length);}
function openCustomer(cid){let c=customer(cid)||{name:'',phone:'',address:'',notes:'',active:true};modal(`<h2 style="margin:0 0 5px">${cid?'Edit customer':'Add customer'}</h2><p class="sub">Keep the contact details you need for delivery.</p><form id="customerForm"><div class="field"><label>Customer name *</label><input name="name" required value="${esc(c.name)}" placeholder="e.g. Rahul Sharma"></div><div class="formgrid"><div class="field"><label>Phone number</label><input name="phone" inputmode="tel" value="${esc(c.phone)}" placeholder="Mobile"></div><div class="field"><label>Status</label><select name="active"><option value="true" ${c.active!==false?'selected':''}>Active</option><option value="false" ${c.active===false?'selected':''}>Inactive</option></select></div><div class="field full"><label>Address / delivery location</label><textarea name="address" rows="2" placeholder="House, street, area">${esc(c.address)}</textarea></div><div class="field full"><label>Notes</label><textarea name="notes" rows="2" placeholder="Delivery instructions (optional)">${esc(c.notes)}</textarea></div></div><div class="actions"><button class="btn" type="submit">Save customer</button><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>${cid?`<button class="btn danger" type="button" onclick="deleteCustomer('${cid}')">Delete</button>`:''}</div></form>`);
document.getElementById('customerForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:cid||id(),name:f.get('name').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),notes:f.get('notes').trim(),active:f.get('active')==='true',createdAt:c.createdAt||nowISO()};if(cid)db.customers=db.customers.map(x=>x.id===cid?obj:x);else db.customers.push(obj);closeModal();save();toast('Customer saved');};}
function deleteCustomer(cid){if(!confirm('Delete this customer profile? Existing transactions will remain in the ledger.'))return;db.customers=db.customers.filter(c=>c.id!==cid);closeModal();save();toast('Customer deleted');}
function openTx(type='delivery',cid=''){let types=[['delivery','Water delivered'],['return','Empty jars returned'],['payment','Payment received'],['deposit_in','Security deposit received'],['deposit_out','Security deposit refunded'],['adjustment','Balance adjustment']];let chosen=type;let opts=db.customers.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('');if(!db.customers.length){toast('Add a customer first');openCustomer();return;}
modal(`<h2 style="margin:0 0 5px">New transaction</h2><p class="sub">Each entry gets its own date and is added to the ledger.</p><form id="txForm"><div class="field"><label>Transaction type</label><select name="type" id="txType">${types.map(([v,l])=>`<option value="${v}" ${v===chosen?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Customer *</label><select name="customerId" required>${opts}</select></div><div class="formgrid"><div class="field"><label>Date *</label><input type="date" name="date" required value="${todayISO()}"></div><div class="field" id="jarsField"><label>Number of 20-litre jars</label><input type="number" name="jars" min="1" step="1" value="1"></div><div class="field" id="amountField"><label id="amountLabel">Water charge (₹)</label><input type="number" name="amount" min="0" step=".01" value="${db.settings.jarPrice}" required></div><div class="field" id="methodField"><label>Payment method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></div><div class="field full"><label>Note / reference (optional)</label><input name="note" placeholder="UPI reference, delivery note…"></div></div><div class="note" id="txHint">Water delivered adds jar count and water charges to the customer's balance.</div><div class="actions"><button class="btn" type="submit">Save transaction</button><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button></div></form>`);
const typ=document.getElementById('txType'),af=document.getElementById('amountField'),jf=document.getElementById('jarsField'),mf=document.getElementById('methodField'),al=document.getElementById('amountLabel'),hint=document.getElementById('txHint'),amount=document.querySelector('#txForm [name=amount]'),jars=document.querySelector('#txForm [name=jars]');
function update(){let t=typ.value; jf.classList.toggle('hidden',!['delivery','return'].includes(t));af.classList.toggle('hidden',t==='return');mf.classList.toggle('hidden',!['payment','deposit_in','deposit_out'].includes(t));al.textContent=({delivery:'Water charge (₹)',payment:'Amount received (₹)',deposit_in:'Deposit collected (₹)',deposit_out:'Deposit refunded (₹)',adjustment:'Adjustment amount (₹)'})[t]||'Amount (₹)';hint.textContent=({delivery:'Adds jars with the customer and adds the water charge to their outstanding balance.',return:'Records empty jars returned. This does not automatically refund the security deposit.',payment:'Reduces the customer’s outstanding water charges.',deposit_in:'Records refundable jar security separately from water charges.',deposit_out:'Records a deposit refund; check the deposit held before saving.',adjustment:'For corrections only. Positive amount adds to the amount due; use the note to explain.'})[t];if(t==='delivery')amount.value=(Number(jars.value)||1)*Number(db.settings.jarPrice||0);if(t==='deposit_in')amount.value=db.settings.defaultDeposit||0;}
typ.onchange=update;jars.oninput=()=>{if(typ.value==='delivery')amount.value=(Number(jars.value)||0)*Number(db.settings.jarPrice||0)};update();
document.getElementById('txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),t=f.get('type'),n=Number(f.get('amount')||0),nj=Number(f.get('jars')||0);if(['delivery','return'].includes(t)&&(!Number.isInteger(nj)||nj<1)){toast('Enter a whole number of jars');return;}let tx={id:id(),customerId:f.get('customerId'),type:t,date:f.get('date'),jars:['delivery','return'].includes(t)?nj:0,amount:t==='return'?0:n,method:f.get('method')||'',note:f.get('note').trim(),createdAt:nowISO()};if(t==='payment'&&n<=0){toast('Enter a payment amount');return;}if(t==='deposit_out'&&n>metrics(tx.customerId).deposit){if(!confirm('This refund is greater than the recorded deposit. Save anyway?'))return;}db.transactions.push(tx);closeModal();save();toast('Transaction saved');};}
function customerDetails(cid){let c=customer(cid);if(!c)return;let m=metrics(cid),ts=txFor(cid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));modal(`<div class="customerhead"><div class="avatar">${esc(c.name.charAt(0).toUpperCase())}</div><div class="grow"><h2 style="margin:0">${esc(c.name)}</h2><div class="sub">${esc(c.phone||'No phone')} · ${esc(c.address||'No address')}</div></div></div><div class="grid" style="margin-top:16px"><div class="stats"><div class="statlabel">Water due</div><div class="statvalue" style="font-size:20px">${cash(m.due)}</div></div><div class="stats"><div class="statlabel">Deposit held</div><div class="statvalue" style="font-size:20px">${cash(m.deposit)}</div></div><div class="stats"><div class="statlabel">Jars out</div><div class="statvalue" style="font-size:20px">${m.jars}</div></div><div class="stats"><div class="statlabel">Total water billed</div><div class="statvalue" style="font-size:20px">${cash(m.water)}</div></div></div><div class="sectiontitle" style="margin-top:20px">Full transaction history</div>${ts.map(txRow).join('')||'<p class="muted">No transactions yet.</p>'}<div class="actions"><button class="btn" onclick="closeModal();openTx('delivery','${cid}')">＋ Deliver</button><button class="btn secondary" onclick="closeModal();openTx('payment','${cid}')">Record payment</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);}
function renderLedger(){let filter=document.getElementById('ledgerSearch')?.value||'';let typeFilter=document.getElementById('ledgerFilter')?.value||'all';let ts=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));ts=ts.filter(t=>{let c=customer(t.customerId);return (!filter||((c?.name||'').toLowerCase().includes(filter.toLowerCase())||(t.note||'').toLowerCase().includes(filter.toLowerCase())))&&(typeFilter==='all'||t.type===typeFilter)});document.getElementById('page-ledger').innerHTML=`
${pageHead('Transactions','A dated record of every jar and rupee','<button class="btn small" onclick="openTx()">＋ Add entry</button>')}
<input class="search" id="ledgerSearch" placeholder="Search customer or note…" value="${esc(filter)}" oninput="renderLedgerKeepFocus(this.value)">
<div class="field"><label>Filter entries</label><select id="ledgerFilter" onchange="renderLedger()"><option value="all">All transactions</option>${[['delivery','Water delivered'],['return','Empty jars returned'],['payment','Payments'],['deposit_in','Deposits collected'],['deposit_out','Deposits refunded'],['adjustment','Adjustments']].map(([v,l])=>`<option value="${v}" ${typeFilter===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="card">${ts.map(t=>`${txRow(t)}<div style="display:flex;justify-content:flex-end;padding:0 0 7px"><button class="btn ghost small" onclick="deleteTx('${t.id}')">Delete entry</button></div>`).join('')||'<div class="empty"><div class="big">🧾</div>No transactions match.</div>'}</div><div class="note">Important: deleting a transaction changes the calculated balance and jar count. Use it only to correct a mistaken entry.</div>`;}
function renderLedgerKeepFocus(v){renderLedger();let e=document.getElementById('ledgerSearch');e.focus();e.setSelectionRange(v.length,v.length);}
function deleteTx(tid){if(!confirm('Delete this transaction? Balances and jar counts will recalculate.'))return;db.transactions=db.transactions.filter(t=>t.id!==tid);save();toast('Entry deleted');}
function renderPlans(){let active=db.plans.filter(p=>p.active!==false);document.getElementById('page-plans').innerHTML=`
${pageHead('Subscriptions','Set recurring water billing for customers','<button class="btn small" onclick="openPlan()">＋ Plan</button>')}
<div class="note">Subscriptions are billing reminders and tracking in this version. They do not automatically charge customers or send messages. Record deliveries and payments in Transactions to update balances.</div>
<div class="section"><div class="sectiontitle">Customer subscriptions</div>${active.map(p=>{let c=customer(p.customerId);return `<div class="card"><div class="itemtop"><div><div class="name">${esc(c?.name||'Deleted customer')}</div><div class="sub">${esc(p.frequency)} plan · ${cash(p.rate)} ${p.billing==='perJar'?'per jar':'per billing period'}</div></div><span class="pill">${esc(p.status||'Active')}</span></div><div class="balance"><span>Start: <strong>${dateFmt(p.start)}</strong></span><span>Next due: <strong>${dateFmt(p.nextDue)}</strong></span></div>${p.note?`<div class="muted" style="margin-top:7px">${esc(p.note)}</div>`:''}<div class="customeractions"><button class="btn secondary small" onclick="openTx('delivery','${p.customerId}')">＋ Deliver</button><button class="btn ghost small" onclick="openPlan('${p.id}')">Edit</button><button class="btn ghost small" onclick="togglePlan('${p.id}')">Pause</button></div></div>`}).join('')||'<div class="card empty"><div class="big">▦</div>No subscriptions yet.<br>Create a daily, weekly or monthly billing plan.</div>'}</div>
<div class="section"><div class="sectiontitle">Billing guide</div><div class="card"><div class="listrow"><div class="ico">☀</div><div class="grow"><b>Daily</b><div class="muted">Good for daily water deliveries; bill each jar or set a daily amount.</div></div></div><div class="listrow"><div class="ico">▦</div><div class="grow"><b>Weekly</b><div class="muted">Review the week's deliveries and collect payment.</div></div></div><div class="listrow"><div class="ico">▣</div><div class="grow"><b>Monthly</b><div class="muted">A regular monthly billing date for households or shops.</div></div></div></div></div>`;}
function addDays(date,n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA');}
function nextDue(start,freq){return addDays(start,freq==='Daily'?1:freq==='Weekly'?7:30);}
function openPlan(pid){let p=db.plans.find(x=>x.id===pid)||{customerId:db.customers[0]?.id||'',frequency:'Monthly',rate:0,billing:'perJar',start:todayISO(),nextDue:todayISO(),status:'Active',note:'',active:true};if(!db.customers.length){toast('Add a customer first');openCustomer();return;}modal(`<h2 style="margin:0 0 5px">${pid?'Edit subscription':'New subscription'}</h2><p class="sub">Choose how you want to bill this customer.</p><form id="planForm"><div class="field"><label>Customer *</label><select name="customerId" required>${db.customers.map(c=>`<option value="${c.id}" ${p.customerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Billing cycle</label><select name="frequency">${['Daily','Weekly','Monthly'].map(v=>`<option ${p.frequency===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Rate applies to</label><select name="billing"><option value="perJar" ${p.billing==='perJar'?'selected':''}>Each 20L jar</option><option value="period" ${p.billing==='period'?'selected':''}>Each billing period</option></select></div><div class="field"><label>Rate (₹)</label><input name="rate" type="number" min="0" step=".01" required value="${p.rate}"></div><div class="field"><label>Start date</label><input name="start" type="date" required value="${p.start}"></div><div class="field"><label>Next billing date</label><input name="nextDue" type="date" required value="${p.nextDue}"></div><div class="field"><label>Status</label><select name="status"><option ${p.status==='Active'?'selected':''}>Active</option><option ${p.status==='Paused'?'selected':''}>Paused</option></select></div><div class="field full"><label>Notes</label><input name="note" value="${esc(p.note)}" placeholder="e.g. collect every Sunday"></div></div><div class="actions"><button class="btn" type="submit">Save plan</button><button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>${pid?`<button class="btn danger" type="button" onclick="deletePlan('${pid}')">Delete</button>`:''}</div></form>`);
document.getElementById('planForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:pid||id(),customerId:f.get('customerId'),frequency:f.get('frequency'),billing:f.get('billing'),rate:Number(f.get('rate')),start:f.get('start'),nextDue:f.get('nextDue'),status:f.get('status'),note:f.get('note').trim(),active:f.get('status')==='Active'};if(pid)db.plans=db.plans.map(x=>x.id===pid?obj:x);else db.plans.push(obj);closeModal();save();toast('Subscription saved');};}
function togglePlan(pid){let p=db.plans.find(x=>x.id===pid);if(!p)return;p.active=false;p.status='Paused';save();toast('Subscription paused');}
function deletePlan(pid){if(!confirm('Delete this subscription plan?'))return;db.plans=db.plans.filter(p=>p.id!==pid);closeModal();save();}
function renderSettings(){let s=db.settings;document.getElementById('page-settings').innerHTML=`
${pageHead('Settings & backup','Keep your records safe')}
<div class="card"><div class="sectiontitle">Business setup</div><form id="settingsForm"><div class="field"><label>Business name</label><input name="brand" value="${esc(s.brand)}" required></div><div class="formgrid"><div class="field"><label>Default price per 20L jar (₹)</label><input name="jarPrice" type="number" min="0" step=".01" value="${s.jarPrice}"></div><div class="field"><label>Default security deposit (₹)</label><input name="defaultDeposit" type="number" min="0" step=".01" value="${s.defaultDeposit}"></div></div><button class="btn" type="submit">Save settings</button></form></div>
<div class="card"><div class="sectiontitle">Backup & restore</div><p class="sub">Your data currently lives in this browser on this device. Export a backup file and store it somewhere safe. Importing a backup replaces the current records.</p><div class="actions"><button class="btn" onclick="exportBackup()">↓ Export backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">↑ Restore backup</button><input class="hidden" type="file" id="importFile" accept=".json,application/json" onchange="importBackup(this.files[0])"></div><div class="divider"></div><div class="listrow"><div class="ico">♙</div><div class="grow"><b>${db.customers.length} customers</b><div class="muted">Customer records stored on this device</div></div></div><div class="listrow"><div class="ico">🧾</div><div class="grow"><b>${db.transactions.length} transactions</b><div class="muted">Dated delivery, return, payment and deposit entries</div></div></div><div class="listrow"><div class="ico">▦</div><div class="grow"><b>${db.plans.length} subscriptions</b><div class="muted">Recurring billing schedules</div></div></div></div>
<div class="card"><div class="sectiontitle">Online backup status</div><div class="pill warn">Cloud backup not connected</div><p class="sub" style="margin-top:10px">This standalone version works offline, but does not silently upload customer information. Online sync needs a secure cloud account/service and setup. Until then, use Export backup regularly and keep a copy outside your phone.</p></div>
<div class="card"><div class="sectiontitle">Data safety</div><p class="sub">Keep your phone locked. Backup files contain customer names, phone numbers, addresses and business transactions; don't share them publicly.</p><button class="btn danger" onclick="clearAll()">Erase all app data</button></div>
<div class="footnote">Maurya Jal Manager · Local-first starter edition</div>`;
document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.settings.brand=f.get('brand').trim();db.settings.jarPrice=Number(f.get('jarPrice')||0);db.settings.defaultDeposit=Number(f.get('defaultDeposit')||0);save();toast('Settings saved');};}
function modal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').showModal();}
function closeModal(){document.getElementById('modal').close();}
function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:nowISO(),format:'maurya-jal-backup-v1'},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maurya-jal-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup export started');}
function importBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.customers)||!Array.isArray(x.transactions)||!Array.isArray(x.plans)||!x.settings)throw Error('Invalid backup');if(!confirm('Restore this backup? It will replace the records currently stored on this device.'))return;db={settings:x.settings,customers:x.customers,transactions:x.transactions,plans:x.plans};save();toast('Backup restored');}catch(e){alert('This file is not a valid Maurya Jal backup.');}};r.readAsText(file);document.getElementById('importFile').value='';}
function clearAll(){if(!confirm('Permanently erase all Maurya Jal data from this browser? Export a backup first if needed.'))return;if(!confirm('This cannot be undone. Erase all customers, transactions and plans?'))return;db={settings:{brand:'Maurya Jal',jarPrice:20,defaultDeposit:100,openingJars:0},customers:[],transactions:[],plans:[]};save();toast('All app data erased');}
renderAll();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script></body></html>
